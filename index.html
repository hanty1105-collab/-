<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>테트리스</title>
<style>
  :root {
    --bg: #0d0f14;
    --panel: #161a22;
    --grid-line: #1f242f;
    --ink: #e8ecf3;
    --sub: #7a8296;
    --accent: #ff6b4a;
    --cell-border: rgba(0,0,0,0.35);

    --c-I: #4adfe0;
    --c-O: #ffd23f;
    --c-T: #b980f0;
    --c-S: #5ce87a;
    --c-Z: #ff5470;
    --c-J: #4a86ff;
    --c-L: #ff9f43;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Courier New', ui-monospace, monospace;
    height: 100%;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }

  .stage {
    display: flex;
    gap: 28px;
    align-items: flex-start;
  }

  .title-block {
    writing-mode: vertical-rl;
    text-orientation: mixed;
    font-size: 13px;
    letter-spacing: 0.35em;
    color: var(--sub);
    padding: 4px 0;
    user-select: none;
  }

  .board-wrap {
    position: relative;
    background: var(--panel);
    padding: 10px;
    border-radius: 4px;
    box-shadow: 0 0 0 1px #23293580, 0 30px 60px -20px rgba(0,0,0,0.6);
  }

  canvas#board {
    display: block;
    background: #0a0c11;
    image-rendering: pixelated;
  }

  .overlay {
    position: absolute;
    inset: 10px;
    background: rgba(10,12,17,0.88);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 20px;
  }
  .overlay.show { display: flex; }
  .overlay h2 {
    margin: 0;
    font-size: 22px;
    letter-spacing: 0.08em;
    color: var(--ink);
    font-weight: normal;
  }
  .overlay p {
    margin: 0;
    color: var(--sub);
    font-size: 13px;
    line-height: 1.6;
  }
  .overlay button, .btn {
    background: transparent;
    border: 1px solid var(--sub);
    color: var(--ink);
    padding: 8px 18px;
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 0.1em;
    cursor: pointer;
    border-radius: 2px;
  }
  .overlay button:hover, .btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .side {
    width: 168px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .panel {
    background: var(--panel);
    border-radius: 4px;
    padding: 14px;
    box-shadow: 0 0 0 1px #23293580;
  }

  .label {
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--sub);
    margin: 0 0 8px 0;
  }

  .value {
    font-size: 24px;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }

  #next-canvas {
    display: block;
    margin: 0 auto;
  }

  .keys {
    font-size: 11px;
    color: var(--sub);
    line-height: 1.9;
  }
  .keys b {
    color: var(--ink);
    font-weight: normal;
    display: inline-block;
    width: 62px;
  }

  .footer-btn {
    width: 100%;
  }

  @media (max-width: 560px) {
    .stage { flex-direction: column; align-items: center; }
    .title-block { display: none; }
    .side { flex-direction: row; flex-wrap: wrap; width: 100%; max-width: 300px; }
    .panel { flex: 1 1 130px; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="title-block">TETRIS · 테트리스</div>

  <div class="board-wrap">
    <canvas id="board" width="240" height="480"></canvas>
    <div class="overlay show" id="overlay">
      <h2>테트리스</h2>
      <p>방향키로 이동, 위쪽으로 회전<br>스페이스바로 즉시 낙하</p>
      <button id="start-btn">시작 (Enter)</button>
    </div>
  </div>

  <div class="side">
    <div class="panel">
      <p class="label">SCORE</p>
      <p class="value" id="score">0</p>
    </div>
    <div class="panel">
      <p class="label">LEVEL</p>
      <p class="value" id="level">1</p>
    </div>
    <div class="panel">
      <p class="label">LINES</p>
      <p class="value" id="lines">0</p>
    </div>
    <div class="panel">
      <p class="label">NEXT</p>
      <canvas id="next-canvas" width="80" height="80"></canvas>
    </div>
    <div class="panel keys">
      <div><b>← →</b>이동</div>
      <div><b>↓</b>소프트 드롭</div>
      <div><b>↑</b>회전</div>
      <div><b>SPACE</b>하드 드롭</div>
      <div><b>P</b>일시정지</div>
    </div>
    <button class="btn footer-btn" id="pause-btn">일시정지</button>
  </div>
</div>

<script>
(function () {
  const COLS = 10, ROWS = 20, CELL = 24;
  const boardCanvas = document.getElementById('board');
  const ctx = boardCanvas.getContext('2d');
  const nextCanvas = document.getElementById('next-canvas');
  const nctx = nextCanvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('start-btn');
  const pauseBtn = document.getElementById('pause-btn');
  const scoreEl = document.getElementById('score');
  const levelEl = document.getElementById('level');
  const linesEl = document.getElementById('lines');

  const COLORS = {
    I: getVar('--c-I'), O: getVar('--c-O'), T: getVar('--c-T'),
    S: getVar('--c-S'), Z: getVar('--c-Z'), J: getVar('--c-J'), L: getVar('--c-L')
  };
  function getVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  const SHAPES = {
    I: [[0,1],[1,1],[2,1],[3,1]],
    O: [[1,0],[2,0],[1,1],[2,1]],
    T: [[1,0],[0,1],[1,1],[2,1]],
    S: [[1,0],[2,0],[0,1],[1,1]],
    Z: [[0,0],[1,0],[1,1],[2,1]],
    J: [[0,0],[0,1],[1,1],[2,1]],
    L: [[2,0],[0,1],[1,1],[2,1]]
  };
  const TYPES = Object.keys(SHAPES);

  let grid, current, nextType, bag, score, level, lines, dropInterval, dropTimer, lastTime;
  let running = false, paused = false, gameOver = false;

  function emptyGrid() {
    return Array.from({length: ROWS}, () => Array(COLS).fill(null));
  }

  function refillBag() {
    bag = [...TYPES];
    for (let i = bag.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [bag[i], bag[j]] = [bag[j], bag[i]];
    }
  }

  function drawFromBag() {
    if (!bag || bag.length === 0) refillBag();
    return bag.pop();
  }

  function newPiece(type) {
    const cells = SHAPES[type].map(([x, y]) => ({x: x + 3, y: y}));
    return { type, cells, rotation: 0 };
  }

  function rotateCells(piece) {
    if (piece.type === 'O') return piece.cells.map(c => ({...c}));
    const pivot = piece.cells[1];
    return piece.cells.map(({x, y}) => {
      const relX = x - pivot.x, relY = y - pivot.y;
      return { x: pivot.x - relY, y: pivot.y + relX };
    });
  }

  function collides(cells) {
    for (const {x, y} of cells) {
      if (x < 0 || x >= COLS || y >= ROWS) return true;
      if (y >= 0 && grid[y][x]) return true;
    }
    return false;
  }

  function lockPiece() {
    for (const {x, y} of current.cells) {
      if (y < 0) { triggerGameOver(); return; }
      grid[y][x] = current.type;
    }
    clearLines();
    spawnPiece();
  }

  function clearLines() {
    let cleared = 0;
    for (let y = ROWS - 1; y >= 0; y--) {
      if (grid[y].every(cell => cell)) {
        grid.splice(y, 1);
        grid.unshift(Array(COLS).fill(null));
        cleared++;
        y++;
      }
    }
    if (cleared > 0) {
      const points = [0, 100, 300, 500, 800][cleared] * level;
      score += points;
      lines += cleared;
      level = 1 + Math.floor(lines / 10);
      dropInterval = Math.max(80, 800 - (level - 1) * 70);
      updateHUD();
    }
  }

  function spawnPiece() {
    const type = nextType || drawFromBag();
    nextType = drawFromBag();
    current = newPiece(type);
    if (collides(current.cells)) {
      triggerGameOver();
    }
    drawNext();
  }

  function triggerGameOver() {
    gameOver = true;
    running = false;
    showOverlay('게임 오버', `점수: ${score}`, '다시 시작 (Enter)');
  }

  function showOverlay(title, sub, btnText) {
    overlay.querySelector('h2').textContent = title;
    overlay.querySelector('p').textContent = sub;
    startBtn.textContent = btnText;
    overlay.classList.add('show');
  }
  function hideOverlay() {
    overlay.classList.remove('show');
  }

  function move(dx) {
    const moved = current.cells.map(c => ({x: c.x + dx, y: c.y}));
    if (!collides(moved)) current.cells = moved;
  }

  function softDrop() {
    const moved = current.cells.map(c => ({x: c.x, y: c.y + 1}));
    if (!collides(moved)) {
      current.cells = moved;
      return true;
    } else {
      lockPiece();
      return false;
    }
  }

  function hardDrop() {
    while (softDrop()) { score += 2; }
    updateHUD();
  }

  function rotate() {
    const rotated = rotateCells(current);
    const kicks = [0, -1, 1, -2, 2];
    for (const k of kicks) {
      const kicked = rotated.map(c => ({x: c.x + k, y: c.y}));
      if (!collides(kicked)) {
        current.cells = kicked;
        return;
      }
    }
  }

  function updateHUD() {
    scoreEl.textContent = score;
    levelEl.textContent = level;
    linesEl.textContent = lines;
  }

  function drawCell(context, x, y, color, size) {
    context.fillStyle = color;
    context.fillRect(x * size, y * size, size, size);
    context.strokeStyle = 'rgba(0,0,0,0.35)';
    context.lineWidth = 2;
    context.strokeRect(x * size + 1, y * size + 1, size - 2, size - 2);
    context.fillStyle = 'rgba(255,255,255,0.15)';
    context.fillRect(x * size, y * size, size, 3);
  }

  function draw() {
    ctx.fillStyle = '#0a0c11';
    ctx.fillRect(0, 0, boardCanvas.width, boardCanvas.height);

    ctx.strokeStyle = '#1f242f';
    ctx.lineWidth = 1;
    for (let x = 0; x <= COLS; x++) {
      ctx.beginPath();
      ctx.moveTo(x * CELL, 0);
      ctx.lineTo(x * CELL, ROWS * CELL);
      ctx.stroke();
    }
    for (let y = 0; y <= ROWS; y++) {
      ctx.beginPath();
      ctx.moveTo(0, y * CELL);
      ctx.lineTo(COLS * CELL, y * CELL);
      ctx.stroke();
    }

    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (grid[y][x]) drawCell(ctx, x, y, COLORS[grid[y][x]], CELL);
      }
    }

    if (current) {
      for (const {x, y} of current.cells) {
        if (y >= 0) drawCell(ctx, x, y, COLORS[current.type], CELL);
      }
    }
  }

  function drawNext() {
    nctx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
    if (!nextType) return;
    const cells = SHAPES[nextType];
    const size = 16;
    const xs = cells.map(c => c[0]), ys = cells.map(c => c[1]);
    const w = (Math.max(...xs) - Math.min(...xs) + 1) * size;
    const h = (Math.max(...ys) - Math.min(...ys) + 1) * size;
    const offX = (nextCanvas.width - w) / 2 - Math.min(...xs) * size;
    const offY = (nextCanvas.height - h) / 2 - Math.min(...ys) * size;
    for (const [x, y] of cells) {
      nctx.fillStyle = COLORS[nextType];
      nctx.fillRect(offX + x * size, offY + y * size, size, size);
      nctx.strokeStyle = 'rgba(0,0,0,0.35)';
      nctx.strokeRect(offX + x * size + 1, offY + y * size + 1, size - 2, size - 2);
    }
  }

  function loop(time) {
    if (!running) return;
    if (!paused) {
      if (!lastTime) lastTime = time;
      const delta = time - lastTime;
      if (delta > dropInterval) {
        softDrop();
        lastTime = time;
      }
      draw();
    }
    requestAnimationFrame(loop);
  }

  function resetGame() {
    grid = emptyGrid();
    score = 0; level = 1; lines = 0;
    dropInterval = 800;
    bag = null; nextType = null;
    gameOver = false; paused = false;
    updateHUD();
    spawnPiece();
    draw();
  }

  function startGame() {
    resetGame();
    running = true;
    lastTime = 0;
    hideOverlay();
    pauseBtn.textContent = '일시정지';
    requestAnimationFrame(loop);
  }

  function togglePause() {
    if (!running || gameOver) return;
    paused = !paused;
    pauseBtn.textContent = paused ? '재개' : '일시정지';
    if (paused) {
      showOverlay('일시정지', '계속하려면 P 또는 아래 버튼', '재개');
    } else {
      hideOverlay();
      lastTime = 0;
    }
  }

  startBtn.addEventListener('click', () => {
    if (paused) { togglePause(); } else { startGame(); }
  });
  pauseBtn.addEventListener('click', togglePause);

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (!running || gameOver)) {
      startGame();
      return;
    }
    if (!running || gameOver) return;
    if (e.key === 'p' || e.key === 'P') { togglePause(); return; }
    if (paused) return;

    switch (e.key) {
      case 'ArrowLeft': move(-1); draw(); e.preventDefault(); break;
      case 'ArrowRight': move(1); draw(); e.preventDefault(); break;
      case 'ArrowDown': softDrop(); draw(); e.preventDefault(); break;
      case 'ArrowUp': rotate(); draw(); e.preventDefault(); break;
      case ' ': hardDrop(); draw(); e.preventDefault(); break;
    }
  });

  grid = emptyGrid();
  draw();
})();
</script>

</body>
</html>
